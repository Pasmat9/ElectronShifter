<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Hello from Electron renderer!</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>

  <body>
    <div class = 'tabulkaWrap'>
      <div class="ovladaniSticky">
        <div class="ovladaciRoletka">
          <button class="tlacitkoMenu">☰ Akce / Nastavení</button>
          <div class="roletkaObsah">
            <button id="uloz">Uložit do souboru</button>
            <button id="nacti">Načíst ze souboru</button>
            <button id="tisk">Vytisknout plán</button>
            </div>
          </div>
          <div class = 'ovladaciLista'>
            <button id="přidavač">Přidat řádek</button>
            <button id="generatorSmen">Generuj směny</button>
            <div class="inputSkupina">
              <label for="vyberPoctuNaDenni">Počet pracovníků na všední dny denní:</label>
              <input type="number" class="inputProSmeny" id="vyberPoctuNaDenni" value="1">
            </div>
            <div class="inputSkupina">
              <label for="vyberPoctuNaRanni">ranní:</label>
              <input type="number" class="inputProSmeny" id="vyberPoctuNaRanni" value="1">
            </div>
            <div class="inputSkupina">
              <label for="vyberPoctuNaNocni">noční:</label>
              <input type="number" class="inputProSmeny" id="vyberPoctuNaNocni" value="1">
            </div>
            <div class="inputSkupina">
              <label for="vyberPoctuNaDenniVikendy">Počet pracovníků na víkend denní:</label>
              <input type="number" class="inputProSmeny" id="vyberPoctuNaDenniVikendy" value="1">
            </div>
            <div class="inputSkupina">
              <label for="vyberPoctuNaNocniVikendy">noční:</label>
              <input type="number" class="inputProSmeny" id="vyberPoctuNaNocniVikendy" value="1">
            </div>
          </div>
      </div>

      <table>
        <thead>
          <tr id="Rok">
            <td></td>
            <td></td>
            <td></td>
            <td id="rokSpan"><select id="selectRok"></select></td>
            <td></td>
            <td></td>
          </tr>
          <tr id="Měsíc">
            <td>Úvazek</td>
            <td>Jméno</td>
            <td>Hodinový fond</td>
            <td id="měsícSpan">
              <select id="selectMěsíc">
              <option value="1">Leden</option>
              <option value="2">Únor</option>
              <option value="3">Březen</option>
              <option value="4">Duben</option>
              <option value="5">Květen</option>
              <option value="6">Červen</option>
              <option value="7">Červenec</option>
              <option value="8">Srpen</option>
              <option value="9">Září</option>
              <option value="10">Říjen</option>
              <option value="11">Listopad</option>
              <option value="12">Prosinec</option>
              </select></td>
            <td>Hodiny za tento měsíc</td>
            <td>Převod hodin do fondu</td>
          </tr>
        </thead>
      
        <tr id="Den"></tr>
        <tr id="DenVTýdnu"></tr>
      </table>

      <button id="ubírač">Odebrat řádek</button>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
